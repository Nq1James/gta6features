name: GTA VI Automatic Photo Updates
on:
  schedule:
    - cron: '37 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gta6-photo-updates
  cancel-in-progress: false
jobs:
  update-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build sourced photo feed
        run: python scripts/update_photos.py
      - name: Publish gallery photos
        run: |
          git add photo-updates.json
          if git diff --cached --quiet; then
            echo "No photo updates"
            exit 0
          fi
          git config user.name "LEONIDA Photo Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh sourced GTA VI gallery images"
          git pull --rebase
          git push
